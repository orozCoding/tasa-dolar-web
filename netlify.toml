# Build/publish settings stay in the Netlify UI (Vite default: `npm run build` -> dist).
# This file only adds the serverless function and the no-index headers.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the brecha page and its data endpoint out of search indexes.
[[headers]]
  for = "/tasa"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/tasa"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/rates"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Tasa Dolar Pro (/pro here, and every path on app.tasadolar.com) is for
# subscribers only; keep it out of search indexes. Header rules only match
# paths, not hosts, so on app.tasadolar.com the page's own noindex meta tag
# does this. Like /tasa, it is deliberately not disallowed in robots.txt, so
# crawlers can fetch it and see the noindex.
[[headers]]
  for = "/pro"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
